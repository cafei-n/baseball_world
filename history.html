<!DOCTYPE html>
<html lang="ja">

    <head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Ranking History</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>

     <link rel="stylesheet" href="css/style.css">

    </head>

<body>

    <header class="header">

    <a href="index.html" class="logo">
        世界野球ランキング
    </a>

    <button
        class="menu-button"
        onclick="toggleMenu()">

        ☰

    </button>

</header>

<nav id="menu" class="menu">

    <a href="index.html">
        ランキング
    </a>

    <a href="history.html">
        グラフ・アニメーション
    </a>

    <a href="country.html">
        国別戦績
    </a>

    <a href="schedule.html">
        試合日程・結果
    </a>

    <a href="tournament.html">
        大会情報
    </a>

</nav>

<h1>野球ランキングチャート</h1>

<div class="control">

    <label>
        開始日
    </label>

    <input
        type="date"
        id="startDate"
        onchange="showHistory()"
    >

    <label>
        終了日
    </label>

    <input
        type="date"
        id="endDate"
        onchange="showHistory()"
    >

    <label>
        表示
    </label>

    <select id="graphType" 
        onchange="showHistory()">

        <option value="rank">
            順位
        </option>

        <option value="point">
            ポイント
        </option>

    </select>

</div>

<div class="control">

    <label>
        地域
    </label>

    <select
        id="regionFilter"
        onchange="changeRegion()"
    >

        <option value="">全地域</option>

        <option value="Asia">アジア</option>
        <option value="East Asia">東アジア</option>
        <option value="Southeast Asia">東南アジア</option>
        <option value="South Asia">南アジア</option>
        <option value="West Asia">西アジア</option>

        <option value="Europe">ヨーロッパ</option>
        <option value="West Europe">西ヨーロッパ</option>
        <option value="East Europe">東ヨーロッパ</option>
        <option value="North Europe">北ヨーロッパ</option>
        <option value="South Europe">南ヨーロッパ</option>

        <option value="America">アメリカ</option>
        <option value="North America">北米</option>
        <option value="Central America">中米</option>
        <option value="Caribbean">カリブ海</option>
        <option value="South America">南米</option>

        <option value="Africa">アフリカ</option>
        <option value="East Africa">東アフリカ</option>
        <option value="South Africa">南アフリカ</option>
        <option value="West Africa">西アフリカ</option>

        <option value="Oceania">オセアニア</option>

    </select>

</div>

<div class="control">

    <label>
        表示国
    </label>

    <select
        id="teamSelector"
        multiple
        size="5"
        onchange="showHistory()"
    >

    </select>

</div>

<div id="lastUpdate" class="update-date">
</div>

<div class="chart-container">

    <canvas
        id="chart"
    ></canvas>

</div>

<h1>動く世界ランキング</h1>

<div class="control">

    <label>
        動画
    </label>

    <select id="movieType">

    <option value="ranking">
        順位
    </option>

    <option value="point">
        ポイント
    </option>

    </select>

    <label>
        期間
    </label>

    <select id="moviePeriod">

    <option value="month">
        1か月
    </option>

    <option value="year">
        1年
    </option>

    <option value="4year">
        4年
    </option>

    </select>

    <button onclick="updateMovie()">
        表示
    </button>

</div>

<div class="video-container">

    <video
        id="rankingMovie"
        controls
        preload="metadata"
    >

    <source
        src="movie/ranking_year.mp4"
        type="video/mp4"
    >
    </video>

</div>

<!-- 歴代記録 -->

<h1>世界ランキング歴代記録</h1>

<div id="historicalRecords" class="historical-records">

<div class="record-card">
    <h2>世界1位の通算在任期間</h2>
    <div id="recordWorldNumberOne">
        計算中...
    </div>
</div>

<div class="record-card">
    <h2>年間順位上昇記録</h2>
    <div id="recordRankRise">
        計算中...
    </div>
</div>

<div class="record-card">
    <h2>年間ポイント上昇記録</h2>
    <div id="recordPointRise">
        計算中...
    </div>
</div>

<div class="record-card">
    <h2>年間順位下降記録</h2>
    <div id="recordRankFall">
        計算中...
    </div>
</div>

<div class="record-card">
    <h2>年間ポイント下降記録</h2>
    <div id="recordPointFall">
        計算中...
    </div>
</div>

</div>

<style>
.historical-records {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
    margin: 20px 0 30px;
}

.record-card {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 18px;
    background: #fff;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.06);
    min-width: 0;
}

.record-card h2 {
    font-size: 1.1rem;
    margin: 0 0 14px;
    padding-bottom: 10px;
    border-bottom: 2px solid #ddd;
}

.record-country {
    font-size: 1.35rem;
    font-weight: bold;
    margin-bottom: 8px;
}

.record-value {
    font-size: 1.15rem;
    font-weight: bold;
    margin: 8px 0;
}

.record-detail {
    color: #555;
    font-size: 0.9rem;
    line-height: 1.7;
    overflow-wrap: anywhere;
}

.record-period {
    margin-top: 8px;
    line-height: 1.7;
    overflow-wrap: anywhere;
}

@media (max-width: 600px) {
    .historical-records {
        grid-template-columns: 1fr;
    }

    .record-card {
        padding: 14px;
    }
}
</style>

<script src="js/common.js"></script>
<script src="js/chart.js"></script>
<script src="js/history.js"></script>

</body>

</html>
