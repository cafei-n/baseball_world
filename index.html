<!DOCTYPE html>
<html lang="ja">

    <head>

    <meta charset="UTF-8">

    <title>World Baseball Ranking</title>

    <link rel="stylesheet" href="css/style.css">

    </head>

<body>

    <header class="header">

    <a href="index.html" class="logo">
        世界野球ランキング
    </a>

    <button
        class="menu-button"
        onclick="toggleMenu()">
        ☰
    </button>

</header>

<nav id="menu" class="menu">

    <a href="index.html">
        世界ランキング
    </a>

    <a href="history.html">

    </a>

<h1>世界ランキング</h1>

<!-- ランキングニュース -->
<section id="rankingNewsSection" class="ranking-news">
    <h2>ランキングニュース</h2>
    <ol id="rankingNewsList">
        <li>ニュースを読み込み中...</li>
    </ol>
</section>

<div>
    <label>
        日付指定：
    </label>

    <input type="date" id="dateSelect"
        onchange="showDateRanking()"
    >

</div>

<div>

    <label>
        比較期間：
    </label>

    <select
        id="comparePeriod"
        onchange="showDateRanking()"
    >
        <option value="month">1か月</option>
        <option value="year">1年</option>
        <option value="4year">4年</option>
    </select>

</div>

<div>

    <label>
        地域選択：
    </label>

    <select id="regionFilter" onchange="showDateRanking()">
        <option value="">全地域</option>

        <option value="Asia">アジア</option>
        <option value="East Asia">東アジア</option>
        <option value="Southeast Asia">東南アジア</option>
        <option value="South Asia">南アジア</option>
        <option value="West Asia">西アジア</option>

        <option value="Europe">ヨーロッパ</option>
        <option value="West Europe">西ヨーロッパ</option>
        <option value="East Europe">東ヨーロッパ</option>
        <option value="North Europe">北ヨーロッパ</option>
        <option value="South Europe">南ヨーロッパ</option>

        <option value="America">アメリカ</option>
        <option value="North America">北米</option>
        <option value="Central America">中米</option>
        <option value="Caribbean">カリブ海</option>
        <option value="South America">南米</option>

        <option value="Africa">アフリカ</option>
        <option value="East Africa">東アフリカ</option>
        <option value="South Africa">南アフリカ</option>
        <option value="West Africa">西アフリカ</option>

        <option value="Oceania">オセアニア</option>
    </select>

    <div id="lastUpdate" class="update-date"></div>

</div>

<table>

    <thead>

        <tr>

        <th>順位</th>
        <th id="regionRankHeader" style="display:none;">
            地域順位
        </th>
        <th>国</th>
        <th>ポイント</th>
        <th>前回とのポイント差</th>
        <th>前回との順位差</th>

        </tr>

    </thead>


    <tbody id="ranking">

    </tbody>


</table>

<!-- 世界ランキングマップ -->
<section id="worldMapSection" class="world-map-section">
    <h2>世界ランキングマップ</h2>

    <div class="world-map-controls">
        <label for="worldMapYear">表示年：</label>
        <select id="worldMapYear">
        </select>
        <span id="worldMapDate" class="world-map-date"></span>
    </div>

    <p class="world-map-help">
        国をクリックすると、その国のページを開きます。
    </p>

    <div id="worldRankingMap" role="img" aria-label="年別の野球世界ランキング地図"></div>

    <div class="world-map-legend">
        <span>上位</span>
        <span class="legend-color legend-rank-1"></span>
        <span class="legend-color legend-rank-2"></span>
        <span class="legend-color legend-rank-3"></span>
        <span class="legend-color legend-rank-4"></span>
        <span class="legend-color legend-rank-5"></span>
        <span>下位</span>
        <span class="legend-no-data"></span>
        <span>データなし</span>
    </div>

    <p id="worldMapStatus" class="world-map-status"></p>
</section>

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="js/common.js"></script>
<script src="js/index.js"></script>
<script src="js/world_map.js"></script>

</body>

</html>
